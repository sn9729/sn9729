<svg viewBox="0 0 1200 140" width="1200" height="140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panelGradRun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07050f"/>
      <stop offset="55%" stop-color="#1a1530"/>
      <stop offset="100%" stop-color="#0d0a1a"/>
    </linearGradient>

    <radialGradient id="eyeGradRun" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff7cd"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="glowEyesRun" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="panelClipRun">
      <rect x="0" y="0" width="1200" height="140" rx="24"/>
    </clipPath>

    <style>
      .runner-outer { animation: runX 3.6s linear infinite; }
      @keyframes runX {
        0%   { transform: translateX(-160px); }
        100% { transform: translateX(780px); }
      }
      .bob { animation: bobY 0.32s ease-in-out infinite alternate; }
      @keyframes bobY {
        0%   { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      .tail { transform-origin: 25px 35px; animation: wag 0.55s ease-in-out infinite alternate; }
      @keyframes wag {
        0%   { transform: rotate(-10deg); }
        100% { transform: rotate(12deg); }
      }
      .legF { transform-origin: 100px 50px; animation: strideF 0.32s ease-in-out infinite alternate; }
      .legB { transform-origin: 45px 50px; animation: strideB 0.32s ease-in-out infinite alternate; }
      @keyframes strideF {
        0%   { transform: rotate(-18deg); }
        100% { transform: rotate(18deg); }
      }
      @keyframes strideB {
        0%   { transform: rotate(18deg); }
        100% { transform: rotate(-18deg); }
      }
      .sl1 { animation: flicker 0.45s ease-in-out infinite; }
      .sl2 { animation: flicker 0.45s ease-in-out infinite; animation-delay: 0.12s; }
      .sl3 { animation: flicker 0.45s ease-in-out infinite; animation-delay: 0.24s; }
      @keyframes flicker {
        0%, 100% { opacity: 0.12; }
        50%      { opacity: 0.55; }
      }
      .status { opacity: 0; animation: textFade 8s infinite; font-family: 'Fira Code', monospace; }
      .s1 { animation-delay: 0s; }
      .s2 { animation-delay: 2s; }
      .s3 { animation-delay: 4s; }
      .s4 { animation-delay: 6s; }
      @keyframes textFade {
        0%   { opacity: 0; }
        4%   { opacity: 1; }
        21%  { opacity: 1; }
        26%  { opacity: 0; }
        100% { opacity: 0; }
      }
      .cursor { animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="138.5" rx="24" fill="url(#panelGradRun)" stroke="#5b4bb8" stroke-opacity="0.35" stroke-width="1.5"/>

  <g clip-path="url(#panelClipRun)">
    <g class="runner-outer">
      <g class="bob" transform="translate(0,40)">
        <!-- speed lines -->
        <line class="sl1" x1="-10" y1="30" x2="-30" y2="30" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>
        <line class="sl2" x1="-8"  y1="42" x2="-34" y2="42" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>
        <line class="sl3" x1="-12" y1="54" x2="-28" y2="54" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>

        <!-- tail -->
        <path class="tail" d="M25,35 C3,23 -4,46 12,52" fill="none" stroke="#150f28" stroke-width="9" stroke-linecap="round"/>

        <!-- back leg -->
        <line class="legB" x1="45" y1="50" x2="30" y2="72" stroke="#150f28" stroke-width="7" stroke-linecap="round"/>
        <!-- front leg -->
        <line class="legF" x1="100" y1="50" x2="118" y2="72" stroke="#150f28" stroke-width="7" stroke-linecap="round"/>

        <!-- body -->
        <ellipse cx="70" cy="38" rx="46" ry="19" fill="#150f28" stroke="#6d5dfc" stroke-width="1.4" stroke-opacity="0.3"/>

        <!-- head -->
        <circle cx="120" cy="24" r="17" fill="#150f28" stroke="#6d5dfc" stroke-width="1.4" stroke-opacity="0.3"/>
        <!-- ear -->
        <polygon points="110,12 116,-2 126,13" fill="#150f28" stroke="#6d5dfc" stroke-width="1.2" stroke-opacity="0.3"/>

        <!-- eye -->
        <path d="M119,20 Q124,14 130,20 Q124,26 119,20 Z" fill="url(#eyeGradRun)" filter="url(#glowEyesRun)"/>
      </g>
    </g>
  </g>

  <!-- terminal status text -->
  <text x="715" y="52" font-family="Fira Code, monospace" font-size="15" fill="#8b81c9">sanjay@github:~$</text>

  <text class="status s1" x="715" y="92" font-family="Fira Code, monospace" font-size="24" fill="#e9e6ff">deploying pipelines<tspan class="cursor">_</tspan></text>
  <text class="status s2" x="715" y="92" font-family="Fira Code, monospace" font-size="24" fill="#e9e6ff">training models<tspan class="cursor">_</tspan></text>
  <text class="status s3" x="715" y="92" font-family="Fira Code, monospace" font-size="24" fill="#e9e6ff">debugging at 3am<tspan class="cursor">_</tspan></text>
  <text class="status s4" x="715" y="92" font-family="Fira Code, monospace" font-size="24" fill="#e9e6ff">shipping features<tspan class="cursor">_</tspan></text>
</svg>
