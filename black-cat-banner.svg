<svg viewBox="0 0 1200 400" width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#181624"/>
    </linearGradient>

    <radialGradient id="moonGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </radialGradient>

    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff7cd"/>
      <stop offset="55%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <filter id="glowEyes" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- faint circuit traces -->
  <g stroke="#A9B7FF" stroke-width="1.2" fill="none" opacity="0.10">
    <path d="M40,40 L40,90 L110,90 L110,130"/>
    <path d="M0,340 L90,340 L90,300 L170,300"/>
    <path d="M1160,60 L1090,60 L1090,110 L1030,110"/>
    <path d="M1200,300 L1140,300 L1140,260 L1080,260"/>
  </g>
  <g fill="#A9B7FF" opacity="0.18">
    <circle cx="40" cy="40" r="3"/>
    <circle cx="110" cy="130" r="3"/>
    <circle cx="170" cy="300" r="3"/>
    <circle cx="1030" cy="110" r="3"/>
    <circle cx="1080" cy="260" r="3"/>
  </g>

  <!-- faint binary accents -->
  <text x="30" y="380" font-family="Fira Code, monospace" font-size="14" fill="#A9B7FF" opacity="0.16">01001 10110 00111</text>
  <text x="880" y="30" font-family="Fira Code, monospace" font-size="14" fill="#A9B7FF" opacity="0.14">10101 01100</text>

  <!-- stars -->
  <g fill="#e9e6ff">
    <circle cx="90" cy="70" r="1.6" opacity="0.7"/>
    <circle cx="160" cy="40" r="1.2" opacity="0.5"/>
    <circle cx="260" cy="90" r="1.8" opacity="0.6"/>
    <circle cx="340" cy="50" r="1.3" opacity="0.4"/>
    <circle cx="60" cy="180" r="1.4" opacity="0.5"/>
    <circle cx="200" cy="220" r="1.2" opacity="0.35"/>
    <circle cx="850" cy="220" r="1.5" opacity="0.5"/>
    <circle cx="900" cy="300" r="1.3" opacity="0.4"/>
    <circle cx="1000" cy="200" r="1.6" opacity="0.55"/>
    <circle cx="1100" cy="150" r="1.3" opacity="0.45"/>
    <circle cx="1150" cy="240" r="1.4" opacity="0.5"/>
    <circle cx="820" cy="60" r="1.2" opacity="0.4"/>
    <circle cx="960" cy="330" r="1.3" opacity="0.35"/>
  </g>

  <!-- moon -->
  <circle cx="985" cy="85" r="60" fill="url(#moonGrad)" opacity="0.14" filter="url(#softBlur)"/>
  <circle cx="985" cy="85" r="42" fill="url(#moonGrad)" opacity="0.9"/>

  <!-- ground shadow -->
  <ellipse cx="600" cy="378" rx="150" ry="14" fill="#000000" opacity="0.35" filter="url(#shadowBlur)"/>

  <!-- black cat -->
  <g transform="translate(450,30)">
    <!-- tail -->
    <path d="M230,295 C275,285 295,215 265,168 C248,142 228,150 233,175 C243,213 248,248 218,268"
          fill="none" stroke="#0b0817" stroke-width="26" stroke-linecap="round"/>
    <path d="M230,295 C275,285 295,215 265,168 C248,142 228,150 233,175 C243,213 248,248 218,268"
          fill="none" stroke="#6d5dfc" stroke-width="26" stroke-linecap="round" opacity="0.10"/>

    <!-- ears -->
    <polygon points="70,90 100,15 140,95" fill="#0b0817" stroke="#6d5dfc" stroke-width="1.5" stroke-opacity="0.3"/>
    <polygon points="230,90 200,15 160,95" fill="#0b0817" stroke="#6d5dfc" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- body -->
    <path d="M100,150 C70,190 55,260 60,320 L240,320 C245,260 230,190 200,150 C185,130 115,130 100,150 Z"
          fill="#0b0817" stroke="#6d5dfc" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- front leg seam -->
    <line x1="150" y1="265" x2="150" y2="320" stroke="#1c1730" stroke-width="4" opacity="0.6"/>

    <!-- head -->
    <circle cx="150" cy="110" r="80" fill="#0b0817" stroke="#6d5dfc" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- whiskers -->
    <g stroke="#e9e6ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <line x1="90" y1="115" x2="30" y2="100"/>
      <line x1="90" y1="124" x2="25" y2="124"/>
      <line x1="90" y1="133" x2="30" y2="148"/>
      <line x1="210" y1="115" x2="270" y2="100"/>
      <line x1="210" y1="124" x2="275" y2="124"/>
      <line x1="210" y1="133" x2="270" y2="148"/>
    </g>

    <!-- glowing eyes -->
    <path d="M118,102 Q130,86 143,102 Q130,118 118,102 Z" fill="url(#eyeGrad)" filter="url(#glowEyes)"/>
    <path d="M157,102 Q170,86 183,102 Q170,118 157,102 Z" fill="url(#eyeGrad)" filter="url(#glowEyes)"/>
  </g>
</svg>
